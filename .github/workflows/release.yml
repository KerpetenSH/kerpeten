name: release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  version:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Look for changesets
        id: changesets
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "no changeset is waiting, so there is no version to prepare"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.changesets.outputs.found == 'true'
        with:
          bun-version: "1.4.5"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: steps.changesets.outputs.found == 'true'
        with:
          node-version: "24"
      - if: steps.changesets.outputs.found == 'true'
        run: bun install --frozen-lockfile
      - name: Open or update the version pull request
        if: steps.changesets.outputs.found == 'true'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          script: bun run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs
      - name: Publish the platform packages, wait until npm shows them, then publish the main package
        working-directory: ${{ runner.temp }}/tarballs
        env:
          WAIT_SECONDS: "1800"
          WAIT_STEP_SECONDS: "20"
        run: |
          set -euo pipefail
          needed=11.5.1
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$needed" "$have" | sort -V | head -n 1)" != "$needed" ]; then
            echo "npm $have is older than $needed, which trusted publishing needs" >&2
            exit 1
          fi
          package_name() {
            tar -xOf "$1" package/package.json | jq -r .name
          }
          package_version() {
            tar -xOf "$1" package/package.json | jq -r .version
          }
          shown() {
            npm view "$1@$2" version --prefer-online >/dev/null 2>&1
          }
          publish() {
            name="$(package_name "$1")"
            version="$(package_version "$1")"
            if shown "$name" "$version"; then
              echo "$name@$version is already published"
            else
              npm publish "$1" --access public
            fi
          }
          for tarball in kerpetensh-kerpeten-*.tgz; do
            publish "$tarball"
          done
          for tarball in kerpetensh-kerpeten-*.tgz; do
            name="$(package_name "$tarball")"
            version="$(package_version "$tarball")"
            waited=0
            until shown "$name" "$version"; do
              if [ "$waited" -ge "$WAIT_SECONDS" ]; then
                echo "npm does not show $name@$version after $WAIT_SECONDS seconds, so kerpeten@$version is not published: an install of it would get no binary. Run this workflow again when npm shows the platform packages; it publishes only what is missing." >&2
                exit 1
              fi
              echo "waiting for npm to show $name@$version ($waited s)"
              sleep "$WAIT_STEP_SECONDS"
              waited=$((waited + WAIT_STEP_SECONDS))
            done
            echo "npm shows $name@$version"
          done
          for tarball in kerpeten-*.tgz; do
            publish "$tarball"
          done

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Create the GitHub release of a version that has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "the release v$version is already there"
            exit 0
          fi
          if [ ! -f CHANGELOG.md ]; then
            echo "there is no CHANGELOG.md yet, so v$version gets no release"
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## $version" '$0 == heading { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "CHANGELOG.md has no section for $version, so v$version gets no release"
            exit 0
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file "$notes"
